services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-expense-tracker-backend:local
    env_file:
      - .env
    volumes:
      - expense-data:/app/data
    # No host port mapping: nginx (the frontend container) reaches this over
    # the internal Docker network at http://backend:8000 (see
    # frontend/nginx.conf) and that's the only consumer that needs it — the
    # host never has to reach the raw backend directly.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-expense-tracker-frontend:local
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  expense-data:
